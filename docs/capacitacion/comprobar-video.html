<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Comprobar video</title>
<!-- Revisa un MP4 ya grabado, como lo haría un celular: (1) que diga su duración, (2) que se pueda saltar a la
     mitad y ahí haya imagen, (3) que cada frase suene cuando su escena aparece (la voz no adelantada ni
     atrasada). Escribe el resultado en videos/comprobado-<v>.json. Lo maneja hacer-videos.mjs.
     ?archivo=videos/x.mp4&v=v1 -->
</head>
<body>
<script src="contenido.js"></script>
<script src="sonidos.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get("v"), archivo = q.get("archivo");
  const r = { archivo };
  try {
    // 1 y 2: duración y salto a la mitad
    const vid = document.createElement("video");
    vid.muted = true; vid.preload = "auto"; vid.src = archivo;
    await new Promise((ok, mal) => { vid.onloadedmetadata = ok; vid.onerror = () => mal(new Error("el navegador no lo abre")); });
    r.duracion = +vid.duration.toFixed(2);
    r.tamano = vid.videoWidth + "x" + vid.videoHeight;
    // Saltar a tres puntos y dejarlo correr un momento, como hace una persona; la foto se toma ya andando.
    document.body.appendChild(vid);
    const cv = document.createElement("canvas"); cv.width = 1920; cv.height = 360;
    const g = cv.getContext("2d");
    r.puntos = [];
    for (const [k, f] of [0.25, 0.5, 0.75].entries()) {
      const t = vid.duration * f;
      vid.currentTime = t;
      await new Promise(ok => { vid.onseeked = ok; });
      await Promise.race([vid.play(), new Promise(ok => setTimeout(ok, 3000))]);
      const t1 = performance.now();
      await new Promise(ok => { const mira = () => vid.currentTime > t + 0.6 || performance.now() - t1 > 4000 ? ok() : setTimeout(mira, 50); mira(); });
      vid.pause();
      g.drawImage(vid, k * 640, 0, 640, 360);
      const px = g.getImageData(k * 640, 0, 640, 360).data;
      let suma = 0, suma2 = 0;
      for (let i = 0; i < px.length; i += 4) { const l = (px[i] + px[i + 1] + px[i + 2]) / 3; suma += l; suma2 += l * l; }
      const n = px.length / 4, media = suma / n;
      r.puntos.push({ pedido: +t.toFixed(1), error: vid.error ? vid.error.message : null, segundo: +vid.currentTime.toFixed(1), brillo: Math.round(media), variedad: Math.round(Math.sqrt(suma2 / n - media * media)) });
    }
    await fetch(`/guardar?nombre=${encodeURIComponent("cuadros-" + id + ".png")}`, { method: "POST", body: await new Promise(ok => cv.toBlob(ok)) });

    // 3: la voz a tiempo. Se escucha el audio del MP4 y se buscan los arranques de sonido después de un silencio.
    const ac = new AudioContext();
    const pcm = (await ac.decodeAudioData(await (await fetch(archivo)).arrayBuffer())).getChannelData(0);
    const hz = ac.sampleRate, ven = Math.round(hz * 0.02);
    const energia = [];
    for (let i = 0; i + ven <= pcm.length; i += ven) { let s = 0; for (let j = i; j < i + ven; j++) s += pcm[j] * pcm[j]; energia.push(Math.sqrt(s / ven)); }
    const arranques = []; let callado = 999;
    energia.forEach((e, k) => { if (e < 0.004) callado++; else { if (callado >= 15) arranques.push(+(k * 0.02).toFixed(2)); callado = 0; } });
    r.arranques = arranques.slice(0, 40);
    r.audio_segundos = +(pcm.length / hz).toFixed(2);
    // Lo esperado: la misma línea de tiempo con que se grabó
    const V = window.CAP.videos[id];
    const dur = [];
    for (let k = 0; k < V.escenas.length; k++) {
      const b = await (await fetch(`audio/${id}-${String(k + 1).padStart(2, "0")}.wav`)).arrayBuffer();
      dur.push((await ac.decodeAudioData(b)).duration);
    }
    const linea = window.SONIDOS.linea(dur);
    // Cada escena empieza con su timbre: ese es el arranque que se compara
    const esperado = linea.escenas.map(e => e.ini);
    const dif = esperado.map(t => { const m = arranques.reduce((a, x) => Math.abs(x - t - 0.3) < Math.abs(a - t - 0.3) ? x : a, -99); return +(m - t).toFixed(2); });
    r.desfase = dif;
    const orden = [...dif].sort((a, b) => a - b);
    r.desfase_mediana = orden[Math.floor(orden.length / 2)];
    r.desfase_rango = +(orden[orden.length - 1] - orden[0]).toFixed(2);
    r.ok = r.duracion > 10 && r.puntos.every(p => p.variedad > 40) && Math.abs(r.desfase_mediana - 0.3) < 0.35 && r.desfase_rango < 0.3;
  } catch (e) { r.error = e.message; r.ok = false; }
  await fetch(`/guardar?nombre=${encodeURIComponent("comprobado-" + id + ".json")}`, { method: "POST", body: JSON.stringify(r, null, 1) });
  document.title = "LISTO";
})();
</script>
</body>
</html>
